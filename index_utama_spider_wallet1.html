<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Keuangan Pribadi - Spider-Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Konfigurasi kustom untuk Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Memuat file CSS Eksternal -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-900 text-slate-200 antialiased font-sans flex flex-col min-h-screen">

    <header class="bg-red-600 border-b-4 border-blue-600 text-white shadow-lg py-4">
        <div class="container mx-auto px-4 max-w-4xl flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2 tracking-wide">
                <i class="fa-solid fa-spider text-2xl md:text-3xl drop-shadow-md"></i>
                Spider-Wallet
            </h1>
            <div class="text-sm font-medium opacity-90">Keuangan Pribadi</div>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        
        <!-- Bagian Ringkasan Saldo -->
        <section class="mb-8">
            <div class="bg-slate-800 rounded-2xl shadow-lg p-6 border border-slate-700 relative overflow-hidden">
                <div class="text-center mb-6 relative z-10">
                    <h2 class="text-sm font-medium text-slate-400 uppercase tracking-wider mb-1">Total Saldo Saat Ini</h2>
                    <div id="total-balance" class="text-4xl md:text-5xl font-bold text-white">Rp 0</div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 relative z-10">
                    <!-- Kartu Total Pemasukan -->
                    <div class="bg-slate-900 rounded-xl p-4 border border-slate-700 flex items-center gap-4">
                        <div class="bg-emerald-500/20 text-emerald-500 w-12 h-12 rounded-full flex items-center justify-center text-xl shrink-0">
                            <i class="fa-solid fa-arrow-down"></i>
                        </div>
                        <div>
                            <div class="text-sm font-medium text-slate-400 mb-1">Total Pemasukan</div>
                            <div id="total-income" class="text-xl font-bold text-emerald-500">Rp 0</div>
                        </div>
                    </div>

                    <!-- Kartu Total Pengeluaran -->
                    <div class="bg-slate-900 rounded-xl p-4 border border-slate-700 flex items-center gap-4">
                        <div class="bg-rose-500/20 text-rose-500 w-12 h-12 rounded-full flex items-center justify-center text-xl shrink-0">
                            <i class="fa-solid fa-arrow-up"></i>
                        </div>
                        <div>
                            <div class="text-sm font-medium text-slate-400 mb-1">Total Pengeluaran</div>
                            <div id="total-expense" class="text-xl font-bold text-rose-500">Rp 0</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Bagian Form Input dan Riwayat -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Kolom Kiri: Form Tambah Transaksi -->
            <section class="lg:col-span-1">
                <div class="bg-slate-800 rounded-2xl shadow-lg p-6 border border-slate-700 sticky top-4">
                    <h3 class="text-lg font-bold mb-4 border-b border-slate-700 text-white pb-2 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-red-500"></i> Tambah Transaksi
                    </h3>
                    
                    <form id="transaction-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Jenis Transaksi</label>
                            <div class="flex gap-4">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="type" value="income" class="w-4 h-4 text-blue-600 bg-slate-700 border-slate-600 focus:ring-blue-500" checked>
                                    <span class="text-sm text-slate-300">Pemasukan</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="type" value="expense" class="w-4 h-4 text-red-600 bg-slate-700 border-slate-600 focus:ring-red-500">
                                    <span class="text-sm text-slate-300">Pengeluaran</span>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label for="text" class="block text-sm font-medium text-slate-300 mb-1">Keterangan</label>
                            <input type="text" id="text" placeholder="Cth: Gaji, Jajan, dll" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" required>
                        </div>

                        <div>
                            <label for="amount" class="block text-sm font-medium text-slate-300 mb-1">Nominal (Rp)</label>
                            <input type="text" inputmode="numeric" id="amount" placeholder="0" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" required>
                        </div>
                        
                        <div>
                            <label for="date" class="block text-sm font-medium text-slate-300 mb-1">Tanggal</label>
                            <input type="date" id="date" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 text-white rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" required>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg transition-colors flex justify-center items-center gap-2 mt-6 shadow-lg shadow-blue-500/30">
                            <i class="fa-solid fa-save"></i> Simpan Transaksi
                        </button>
                    </form>
                </div>
            </section>

            <!-- Kolom Kanan: Riwayat Transaksi -->
            <section class="lg:col-span-2">
                <div class="bg-slate-800 rounded-2xl shadow-lg p-6 border border-slate-700 h-full flex flex-col">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <h3 class="text-lg font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-list-ul text-red-500"></i> Riwayat Transaksi
                        </h3>
                        <button id="clear-all-btn" class="text-sm text-red-500 hover:text-red-400 transition-colors hidden font-medium">
                            Hapus Semua
                        </button>
                    </div>

                    <ul id="transaction-list" class="transaction-list flex-grow overflow-y-auto max-h-[500px] pr-2 space-y-3">
                        <li id="empty-state" class="text-center py-10 text-slate-500">
                            <div class="flex justify-center mb-3 opacity-50 text-slate-600 text-5xl">
                                <i class="fa-solid fa-spider"></i>
                            </div>
                            <p>Belum ada transaksi. Jaring uangmu di sini!</p>
                        </li>
                    </ul>
                </div>
            </section>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 py-4 mt-auto text-center text-sm text-slate-500">
        <p>&copy; 2026 Spider-Wallet - Manajemen Keuangan Sederhana</p>
    </footer>

    <!-- Container Notifikasi -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Memuat file JavaScript Eksternal -->
    <script src="app.js"></script>
</body>
</html>
